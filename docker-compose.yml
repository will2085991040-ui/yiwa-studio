# ============================================================
#  AI Interactive Growth Agent —— docker compose 一键启动
#   服务: frontend(Next.js, :3000) / backend(FastAPI, :8000)
#         postgres(pgvector, :5432) / redis(可选, :6379)
# ============================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: growth
      POSTGRES_DB: growth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-growth}:${POSTGRES_PASSWORD:-growth}@postgres:5432/${POSTGRES_DB:-growth}
      # 生产强制登录 + 管理员名单
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 模型提供方（OpenAI 兼容 / 硅基流动 / 火山方舟）
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-mock}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
      VIDEO_API_KEY: ${VIDEO_API_KEY:-}
      YIWA_TOKEN: ${YIWA_TOKEN:-}
      YIWA_GATEWAY_URL: ${YIWA_GATEWAY_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # create_app() 启动时自动执行 ensure_schema() + 管理员 bootstrap（不再依赖 alembic 迁移文件）
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
